services:
  backend:
    build: ../apps/backend
    volumes:
      - ../apps/backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    env_file:
      - .env.backend
    ports:
      - "8888:8888"
    command: sh -c "npm run dev"
    networks:
      - server-mongo
    depends_on:
      - mongo
      - grafana
    dns:
    - 8.8.8.8
    - 8.8.4.4

  frontend:
    build: ../apps/frontend
    volumes:
      - ../apps/frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "pnpm run dev"
    env_file:
      - .env.frontend
    depends_on:
      - backend
    networks:
      - server-mongo
    
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongodb_data-demo:/data/db
    networks:
      - server-mongo

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data-demo:/var/lib/clickhouse
      - ./clickhouse/config/:/etc/clickhouse-server/users.d/
    environment:
      - CLICKHOUSE_DB=default
    ulimits:
      nofile:
        soft: 262144 
        hard: 262144
    networks:
      - server-mongo 

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    ports:
      - "5000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_PROXY_ENABLED=false
    depends_on:
      - clickhouse
    networks:
      - server-mongo

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - server-mongo
    depends_on:
      - backend
      - frontend

volumes:
  mongodb_data-demo:
  backend_node_modules:
  frontend_node_modules:
  clickhouse-data-demo:
  grafana_data:

networks:
  server-mongo:
